<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Love Thy Neighbor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1 class="headline" aria-label="Love thy neighbor">
      <span class="headline__static" aria-hidden="true">Love thy</span>
      <span class="slot" aria-hidden="true">
        <span class="slot__word"></span>
        <span class="slot__word slot__measure"></span>
      </span>
      <span class="headline__static" aria-hidden="true">neighbor</span>
    </h1>
    <button class="toggle" type="button" aria-label="Pause">
      <svg class="toggle__icon toggle__icon--pause" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6" y="5" width="4" height="14" rx="1" />
        <rect x="14" y="5" width="4" height="14" rx="1" />
      </svg>
      <svg class="toggle__icon toggle__icon--play" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" />
      </svg>
      <svg class="toggle__icon toggle__icon--replay" viewBox="2 1 20 20" aria-hidden="true">
        <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
      </svg>
    </button>
  </main>
  <script src="script.js"></script>
</body>
</html>
